name: pipeline

on:
  schedule:
    # o ONS regrava os arquivos por volta das 22h UTC
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      recarga_completa:
        description: Ignorar o cache e reprocessar tudo do zero
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # O runner começa vazio a cada execução. O cache traz a bronze e o banco da
      # execução anterior, e é isso que torna a ingestão e o dbt incrementais aqui.
      - name: Restaurar dados da execução anterior
        if: ${{ !inputs.recarga_completa }}
        uses: actions/cache/restore@v4
        with:
          path: data
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      - name: Ingestão (bronze)
        id: ingestao
        run: python -m ingestao.ingerir

      - name: Transformação e testes (silver e gold)
        id: dbt
        working-directory: dbt
        run: dbt build --profiles-dir .

      # salva mesmo se o dbt falhar: o que já foi baixado não precisa ser baixado de novo
      - name: Salvar dados para a próxima execução
        if: ${{ always() && steps.ingestao.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: data
          key: dados-${{ github.run_id }}

      - name: Gerar dashboard
        run: python -m dashboard.exportar

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
