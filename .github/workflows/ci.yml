name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes da ingestão
        run: python -m pytest

      # valida a sintaxe e as referências dos modelos sem precisar dos dados
      - name: dbt parse
        working-directory: dbt
        run: dbt parse --profiles-dir .
